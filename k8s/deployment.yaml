# Flight Watch API pods. Image and secret names are set up in README "Deploy to GKE".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flightwatch
  labels: {app: flightwatch}
spec:
  replicas: 2
  selector:
    matchLabels: {app: flightwatch}
  template:
    metadata:
      labels: {app: flightwatch}
    spec:
      serviceAccountName: flightwatch      # Workload Identity -> Cloud SQL access (k8s/serviceaccount.yaml)
      containers:
        - name: api
          image: europe-west1-docker.pkg.dev/dsai523-510708/flightwatch/api:v1
          ports:
            - containerPort: 8080
          env:
            - name: FLIGHT_SOURCE              # OpenSky blocks GCP IPs, so adsb.lol here
              value: adsblol
            - name: FLIGHT_CACHE_SECONDS       # adsb.lol: 500 requests/day per IP without a key
              value: "60"
          envFrom:
            - secretRef:
                name: flightwatch-secrets    # INSTANCE_CONNECTION_NAME, DB_*, optional ADSBLOL_API_KEY
          resources:                         # HPA scales on CPU relative to this request
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 20
