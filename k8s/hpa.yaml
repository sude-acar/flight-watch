# Autoscaling: keep average CPU near 60% of the request, between 2 and 10 pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flightwatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flightwatch
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
