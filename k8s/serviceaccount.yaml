# Kubernetes identity of the Flight Watch pods. Through Workload Identity it acts
# as the Google service account below, which has roles/cloudsql.client, so the
# Cloud SQL Python Connector can open connections without any key file.
# The link (roles/iam.workloadIdentityUser) is set up in README "Deploy to GKE".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flightwatch
  annotations:
    iam.gke.io/gcp-service-account: flightwatch-sql@dsai523-510708.iam.gserviceaccount.com
